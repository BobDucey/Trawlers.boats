<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free 2026 San Antonio Trawler Buyer’s Guide | trawlers.boats</title>
<meta name="description" content="Get Capt. Bob's free 2026 San Antonio Trawler Buyer’s Guide now: prices, top brands, new vs. used and buying tips.">
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://www.trawlers.boats/san-antonio-tx-signup">
<script src="https://aiboatleads.com/captbob-track.js" defer></script>
<style>
:root{--bg:#0A1A22;--card:#10242D;--card2:#16303B;--teal:#21B59C;--teal-bright:#29D6B6;--gold:#F2C14E;--text:#F2F5F4;--dim:#B9C4C7;--line:rgba(255,255,255,0.12);}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Helvetica Neue",Helvetica,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 40px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--teal-bright)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px;display:flex;flex-direction:column;gap:16px}
.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;align-self:center;border:2px solid rgba(41,214,182,.7);box-shadow:0 0 12px rgba(41,214,182,.35)}
h1{margin:0;text-align:center;color:var(--gold);font-size:30px;line-height:1.2;font-weight:800}
.sub{margin:-4px 0 0;text-align:center;color:#9fe8d8;font-size:17px;line-height:1.4}
.now{margin:-4px 0 0;text-align:center;color:var(--gold);font-size:24px;font-weight:800}
label{display:block;font-size:15px;color:var(--dim);margin-bottom:6px}
input{width:100%;font-size:18px;padding:14px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);outline:none}
input:focus{border-color:var(--teal-bright)}
button{width:100%;font-size:19px;font-weight:800;padding:16px;border:0;border-radius:14px;background:var(--teal);color:#06231d;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.note{margin:-6px 0 0;text-align:center;font-size:18px;font-weight:600;color:#9fe8d8}
.confirm{background:var(--card2);border:1px solid var(--gold);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.confirm[hidden]{display:none}
.confirm p{margin:0;font-size:16px;line-height:1.45;color:var(--text)}
.cbtns{display:flex;gap:10px}
.cbtns button{font-size:16px;padding:13px 8px}
button.alt{background:transparent;color:var(--text);border:1px solid var(--line)}
.err{margin:0;color:#FFB4A8;font-size:15px;line-height:1.4;min-height:0}
.done{display:none;flex-direction:column;gap:14px;text-align:center}
.done h2{margin:0;color:var(--gold);font-size:26px}
.done p{margin:0;font-size:17px;line-height:1.45;color:var(--text)}
.dl{display:block;text-decoration:none;font-size:26px;font-weight:800;padding:22px 16px;border-radius:14px;background:var(--gold);color:#1a1405}
.es{opacity:.8;font-style:italic}
.ask{display:flex;flex-direction:column;gap:12px}
.ask .q{margin:0;text-align:center;font-size:26px;font-weight:800;color:var(--gold)}
.yn{display:flex;gap:12px}
.yn button{font-size:22px;padding:18px 8px}
button.yes{background:var(--gold);color:#1a1405}
.mailnote{margin:0;text-align:center;font-size:20px;font-weight:700;color:var(--text)}
#reportForm[hidden],.ask[hidden],.mailnote[hidden]{display:none}
</style>
</head>
<body>
<div class="wrap">
<div class="brand"><span class="dot"></span>Trawlers.boats · Powered by AI Boat Leads</div>
<div class="card" id="formCard">
<img class="avatar" src="/capt-bob-avatar.png" alt="Capt. Bob">
<h1>Free 2026 San Antonio Trawler Buyer’s Guide</h1>
<div class="ask" id="askStep" hidden>
<p class="q">Download Now?</p>
<div class="yn"><button type="button" class="yes" id="yesStart">Yes</button><button type="button" class="alt" id="noStart">No</button></div>
</div>
<p class="mailnote" id="mailNote" hidden>No problem. We’ll email it to you.</p>
<p class="note">We’ll also email you a copy.</p>
<form id="reportForm" novalidate hidden>
<div style="display:flex;flex-direction:column;gap:14px">
<div><label for="fname">First name</label><input id="fname" name="fname" autocomplete="given-name" required maxlength="60"></div>
<div><label for="email">Email</label><input id="email" name="email" type="email" inputmode="email" autocomplete="email" required maxlength="200"></div>
<p class="err" id="err" role="alert"></p>
<div class="confirm" id="confirmBox" hidden><p id="confirmText"></p><div class="cbtns"><button type="button" class="alt" id="fixBtn">Fix my email</button><button type="button" id="yesBtn">Yes, send it</button></div></div>
<button type="submit" id="go">Get My Buyer’s Guide Now</button>
</div>
</form>
</div>
<div class="card done" id="doneCard">
<img class="avatar" src="/capt-bob-avatar.png" alt="Capt. Bob">
<h2 id="doneTitle">Your buyer’s guide is ready</h2>
<p id="doneText"></p>
<a class="dl" id="dlLink" href="#" target="_blank" rel="noopener">Download Your Buyer’s Guide Now</a>
</div>
</div>
<script>
(function () {
var SITE = 'Trawlers.boats', METRO = 'San Antonio, TX', BOAT = 'Trawlers', BOAT_ONE = 'Trawler';
var VERIFY_URL = 'https://imgjgrpmjoqlghbkmesy.supabase.co/functions/v1/email-verify';
var BACKEND_URL = 'https://trawlers-boats.vercel.app';
var CONVERSION = 'AW-18469983447/RH4gCJKB7pQdENepludE';
var SESSION = (function () { try { var s = new URLSearchParams(location.search).get('s'); if (s && /^F-[\w-]{8,70}$/.test(s)) return s; } catch (e) {} return ''; })() || 'F-' + ((window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now() + '-' + Math.random().toString(36).slice(2)));
var GCLID = (function () { var id = ''; try { var q = new URLSearchParams(location.search); id = q.get('gclid') || q.get('gbraid') || q.get('wbraid') || ''; } catch (e) {} try { if (id) sessionStorage.setItem('ad_click_id', id); else id = sessionStorage.getItem('ad_click_id') || ''; } catch (e) {} return id; })();

// FUNNEL: step-by-step form tracking (form_events table)
var EV_URL = 'https://imgjgrpmjoqlghbkmesy.supabase.co/rest/v1/form_events', EV_KEY = 'sb_publishable_ZCASTnh-D_DuxnnY_eExMg_kv_ng6ER', T0 = Date.now(), evSeen = {};
function ev_(event, detail, once) {
  if (once) { if (evSeen[event]) return; evSeen[event] = 1; }
  try { fetch(EV_URL, { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json', apikey: EV_KEY, Authorization: 'Bearer ' + EV_KEY, Prefer: 'return=minimal' }, body: JSON.stringify({ session_id: SESSION, site: SITE, event: event, detail: detail == null ? null : String(detail).slice(0, 200) }) }).catch(function () {}); } catch (e) {}
}
(function () {
  var ref = ''; try { ref = document.referrer ? new URL(document.referrer).hostname : ''; } catch (e) {}
  ev_('signup_view', [GCLID ? 'ad' : 'noclick', (window.innerWidth < 700 ? 'mobile' : 'desktop'), ref || 'noref'].join(' | '));
  [5, 15, 30, 60, 120].forEach(function (sec) { setTimeout(function () { if (!document.hidden) ev_('on_page_' + sec + 's'); }, sec * 1000); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) ev_('left_page', Math.round((Date.now() - T0) / 1000) + 's'); });
  var fn = document.getElementById('fname'), em = document.getElementById('email');
  fn.addEventListener('focus', function () { ev_('tap_name', null, 1); });
  em.addEventListener('focus', function () { ev_('tap_email', null, 1); });
  fn.addEventListener('input', function () { ev_('typing_name', null, 1); });
  em.addEventListener('input', function () { ev_('typing_email', null, 1); });
  document.getElementById('dlLink').addEventListener('click', function () { ev_('download_click'); });
})();

// YESNO: ask "Download Now?" first. Yes = form + instant download; No = form + we email it.
var MODE = 'download', GO_LABEL = 'Get My Buyer’s Guide Now';
(function () {
  var ask = document.getElementById('askStep'), frm = document.getElementById('reportForm');
  function showForm() { ask.hidden = true; frm.hidden = false; document.getElementById('go').textContent = GO_LABEL; document.getElementById('fname').focus(); }
  // SPLIT: sign-up page. ?m=email = we email it; otherwise instant download
  var m = ''; try { m = new URLSearchParams(location.search).get('m') || ''; } catch (e) {}
  var note = document.getElementById('mailNote');
  if (m === 'email') { MODE = 'email'; GO_LABEL = 'Email My Buyer’s Guide'; var n = document.querySelector('.note'); if (n) n.textContent = 'It will be in your inbox in a minute.'; note.innerHTML = 'No problem. We’ll email it to you.<br>Please enter your first name and email.'; }
  else { note.textContent = 'Please enter your first name and email.'; }
  note.hidden = false;
  showForm();
})();

var form = document.getElementById('reportForm'), err = document.getElementById('err'), go = document.getElementById('go');
var nameIn = document.getElementById('fname'), emailIn = document.getElementById('email');
function fail(msg) { ev_('error', msg); err.textContent = msg; go.disabled = false; go.textContent = GO_LABEL; }

form.addEventListener('submit', function (ev) {
ev.preventDefault();
ev_('submit');
var name = nameIn.value.trim(), email = emailIn.value.trim().toLowerCase();
err.textContent = '';
if (!name) { fail('Please enter your first name.'); nameIn.focus(); return; }
if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(email)) { fail('Please enter a valid email address.'); emailIn.focus(); return; }
go.disabled = true; go.textContent = 'Checking…';
post({ action: 'check', email: email }).then(function (c) {
if (!c || !c.ok) return showProblem(c);
if (c.verified) return submitForm(name, email);
go.disabled = false; go.textContent = GO_LABEL;
confirmText.textContent = "We couldn't confirm " + email + '. Is it right?';
confirmBox.hidden = false; go.style.display = 'none'; ev_('confirm_shown', email);
pending = { name: name, email: email };
}).catch(function () { fail('Something went wrong. Please try again.'); });
});

var confirmBox = document.getElementById('confirmBox'), confirmText = document.getElementById('confirmText'), pending = null;
function hideConfirm() { confirmBox.hidden = true; go.style.display = ''; }
document.getElementById('fixBtn').addEventListener('click', function () { ev_('confirm_fix'); hideConfirm(); pending = null; emailIn.focus(); emailIn.select(); });
document.getElementById('yesBtn').addEventListener('click', function () { ev_('confirm_yes'); if (!pending) return; var p = pending; pending = null; hideConfirm(); go.disabled = true; go.textContent = 'Sending…'; submitForm(p.name, p.email); });
emailIn.addEventListener('input', function () { if (!confirmBox.hidden) { hideConfirm(); pending = null; } });

function post(body) { return fetch(VERIFY_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) { return r.json(); }); }
function showProblem(r) {
if (r && r.reason === 'typo' && r.suggestion) { emailIn.value = r.suggestion; return fail('Did you mean ' + r.suggestion + '? We fixed it — tap the button again.'); }
if (r && r.reason === 'disposable') return fail('That looks like a temporary inbox. Please use an email you check.');
if (r && r.reason === 'name') return fail('Please enter your first name.');
if (r && (r.reason === 'invalid' || r.reason === 'domain' || r.reason === 'format')) return fail("We can't find that email address. Please double-check it.");
return fail('Something went wrong. Please try again.');
}
function submitForm(name, email) {
post({ action: 'form', name: name, email: email, site: SITE, metro: METRO, boat_type: BOAT, gclid: GCLID, session_id: SESSION })
.then(function (r) {
if (!r || !r.ok) return showProblem(r);
ev_('success', MODE);
try { if (window.gtag) window.gtag('event', 'conversion', { send_to: CONVERSION }); } catch (e) {}
document.getElementById('formCard').style.display = 'none';
var done = document.getElementById('doneCard'); done.style.display = 'flex';
var first = name.split(' ')[0];
var dl = document.getElementById('dlLink');
if (r.token && MODE !== 'email') {
dl.href = 'https://www.aiboatleads.com/report.html?t=' + encodeURIComponent(r.token);
document.getElementById('doneText').textContent = 'Thanks, ' + first + '! Your 2026 San Antonio ' + BOAT_ONE + ' Buyer’s Guide is ready. We also emailed a copy to ' + email + '.';
} else {
dl.style.display = 'none';
document.getElementById('doneTitle').textContent = 'Check your email';
document.getElementById('doneText').textContent = 'Thanks, ' + first + '! Your 2026 San Antonio ' + BOAT_ONE + ' Buyer’s Guide is on its way to ' + email + '. Open the email from Capt. Bob to read it.';
}
})
.catch(function () { fail('Something went wrong. Please try again.'); });
}
})();
</script>
</body>
</html>
